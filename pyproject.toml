[project]
name = "learning-ml-ai"
version = "0.1.0"
description = "Learning ML and AI with actual code examples and explanations."
readme = "README.md"
authors = [{ name = "clavesi", email = "gitclavesi@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
]

[project.scripts]
learning-ml-ai = "learning_ml_ai:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ipykernel>=7.3.0", "uv>=0.12.3"]
